<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="../main.css" />
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) {
          window.exampleAppReady = Promise.resolve()
          return
        }

        var basePath =
          window.location.pathname.split('/exampleapp')[0] + '/exampleapp/'

        // Controlled pages already have the API: do not register on every visit.
        if (
          navigator.serviceWorker.controller &&
          navigator.serviceWorker.controller.scriptURL ===
            new URL(basePath + 'service-worker.js', window.location.href).href
        ) {
          window.exampleAppReady = Promise.resolve()
          return
        }

        window.exampleAppReady = navigator.serviceWorker
          .register(basePath + 'service-worker.js', { scope: basePath })
          .then(function () {
            return navigator.serviceWorker.ready
          })
          .then(function () {
            if (!navigator.serviceWorker.controller) {
              window.location.reload()
              return new Promise(function () {})
            }
          })
      })()
    </script>
    <script src="../main.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Notes</h1>
      <div id="notes"></div>
      <form action="../new_note" method="post">
        <input type="text" name="note" /><br />
        <input type="submit" value="Save" />
      </form>
    </div>
  </body>
</html>
